name: Build Debug APK

# 触发条件：push 到 main/master、打 v* 标签、PR、手动触发
on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      # ubuntu-latest 镜像自带 Android SDK，这里只需接受许可并补齐编译所需组件
      # 注意：不要用 android-actions/setup-android@v3，它会安装已下架的 tools 包导致失败
      - name: 安装 Android SDK 组件并接受许可
        run: |
          SDKMGR="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          echo "使用 sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 赋予 gradlew 执行权限
        run: chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 上传 APK 到 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CalculatorApp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      # 只有打标签（如 v1.0）推送时才会自动创建 Release 并附上 APK
      # 用 GitHub 自带的 gh CLI，不依赖第三方 Action
      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" app/build/outputs/apk/debug/*.apk --clobber
          else
            gh release create "$TAG" app/build/outputs/apk/debug/*.apk --title "$TAG" --generate-notes
          fi
